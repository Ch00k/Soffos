name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Set version from tag
        run: |
          sed -i '' "s/VERSION_PLACEHOLDER/${{ github.ref_name }}/g" build.sh

      - name: Test
        run: swift test

      - name: Build
        run: |
          chmod +x build.sh
          ./build.sh --universal

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: Soffos.zip
          generate_release_notes: true
